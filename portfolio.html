<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio - C.B Photography</title>
  <link rel="stylesheet" href="images/style.css">
</head>
<body>
  <div class="scanlines"></div>
  <main>
    <section class="portfolio" id="portfolio">
      <a href="index.html" class="crt-btn portfolio-back" onclick="playPortfolioBackSound(this, event)">[ BACK ]</a>
      <div class="section-header">
        <span class="section-icon folder-icon" aria-hidden="true"></span>
        <h1>[ PORTFOLIO ] <span class="blink">&#9646;</span></h1>
        <span class="section-meta">C:\PHOTOS\PORTFOLIO\ &#8212; 4 ITEMS</span>
      </div>
      <div class="file-explorer">
        <div class="explorer-toolbar"><span>Click to Expand</span></div>
        <div class="photo-grid">
          <div class="photo-card" onclick="showGlitch('black-white-fashion.html')" style="cursor:pointer;"><div class="card-titlebar"><span>&nbsp;</span></div><div class="card-thumb-grid"><img src="images/1content_C_Beas.jpg.jpg" alt="photo 1"><img src="images/2content_C_Beas.jpg.jpg" alt="photo 2"><img src="images/3content_C_Beas.jpg.jpg" alt="photo 3"><img src="images/5content_C_Beas.jpg.jpg" alt="photo 4"></div><div class="card-footer"><span>Black &amp; White Fashion</span><span>4 FILES</span></div></div>
          <div class="photo-card" onclick="showGlitch('street-fashion.html')" style="cursor:pointer;"><div class="card-titlebar"><span>&nbsp;</span></div><div class="card-thumb-grid"><img src="Images 2/6content_C_Beas.jpg.jpg" alt="street photo 1"><img src="Images 2/7content_C_Beas.jpg.jpg" alt="street photo 2"><img src="Images 2/8content_C_Beas.jpg.jpg" alt="street photo 3"><img src="Images 2/9content_C_Beas.jpg.jpg" alt="street photo 4"></div><div class="card-footer"><span>Street Fashion</span><span>6 FILES</span></div></div>
          <div class="photo-card" onclick="showGlitch('editorial-fashion.html')" style="cursor:pointer;"><div class="card-titlebar"><span>&nbsp;</span></div><div class="card-thumb-grid"><img src="Editorial Fashion/Artboard 1.jpg" alt="editorial photo 1"><img src="Editorial Fashion/Artboard 2.jpg" alt="editorial photo 2"><img src="Editorial Fashion/Editorial_Carlos_Beas.jpg" alt="editorial photo 3"><img src="Editorial Fashion/Artboard 1.jpg" alt="editorial photo 4"></div><div class="card-footer"><span>Editorial Fashion</span><span>3 FILES</span></div></div>
          <div class="photo-card" onclick="showGlitch('glitch.html')" style="cursor:pointer;"><div class="card-titlebar"><span>&nbsp;</span></div><div class="card-thumb-grid"><img src="glitch/Glitching-Out_1.jpg" alt="glitch photo 1"><img src="glitch/Glitching-Out_2.jpg" alt="glitch photo 2"><img src="glitch/Glitching-Out_3.jpg" alt="glitch photo 3"><img src="glitch/Glitching-Out_4.jpg" alt="glitch photo 4"></div><div class="card-footer"><span>GLITCH</span><span>4 FILES</span></div></div>
        </div>
      </div>
    </section>
  </main>

  <footer class="taskbar">
    <div class="taskbar-start"><button class="start-btn">&#x229E; START</button></div>
    <div class="taskbar-items"><span class="taskbar-item active">&#128247; PORTFOLIO</span></div>
    <div class="taskbar-tray">
      <span>&#128266;</span>
      <span>&#128225;</span>
      <span class="tray-time" id="clock">00:00</span>
    </div>
  </footer>

  <script>
    var portfolioUiSound = new Audio('Sounds/ui-sound-16.mp3');
    portfolioUiSound.volume = 1;

    function playPortfolioBackSound(link, event) {
      event.preventDefault();
      var target = link.href;
      portfolioUiSound.currentTime = 0;
      portfolioUiSound.play().catch(function() {});
      showTransition(target);
    }

    function showGlitch(url) {
      portfolioUiSound.currentTime = 0;
      portfolioUiSound.play().catch(function() {});
      showTransition(url);
    }

    function showTransition(url) {
      var overlay = document.createElement('div');
      overlay.className = 'glitch-overlay';
      overlay.innerHTML = '<div class="glitch-lines"></div>';
      document.body.appendChild(overlay);
      overlay.style.display = 'block';
      setTimeout(function() {
        window.location.href = url;
      }, 700);
    }

    function updateClock() {
      var now = new Date();
      document.getElementById('clock').textContent = String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');
    }
    updateClock();
    setInterval(updateClock, 1000);
  </script>
</body>
</html>
