<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR Code — C.B Photography</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=VT323&family=Orbitron:wght@400;700;900&display=swap');
    body {
      font-family: 'Share Tech Mono', monospace;
      background: #020204;
      color: #a8f4ff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 24px;
      text-align: center;
      position: relative;
      overflow-x: hidden;
    }
    .card {
      box-sizing: border-box;
      background: rgba(2, 4, 9, 0.95);
      border: 2px solid;
      border-color: #0d0d26;
      box-shadow: 2px 2px 0 #000;
      padding: 24px;
      max-width: 420px;
      width: 100%;
    }
    h1 { margin-bottom: 12px; font-size: 24px; letter-spacing: 0.08em; color: #00e0ff; }
    .back-btn {
      position: absolute;
      top: 24px;
      left: 24px;
      padding: 6px 16px;
      border: 2px solid;
      border-color: #0d0d26;
      color: #a8f4ff;
      font-family: 'Share Tech Mono', monospace;
      font-size: 13px;
      text-decoration: none;
      letter-spacing: 0.08em;
      background: transparent;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }
    .back-btn:hover { background: #101020; color: #00e0ff; }
    #qrcode { display: inline-block; }
    .url { word-break: break-all; margin-top: 18px; font-size: 13px; color: #00e0ff; letter-spacing: 0.08em; }
    .glitch-overlay {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: none;
      pointer-events: none;
    }
    .glitch-lines {
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(
        to bottom,
        transparent 0px,
        transparent 4px,
        rgba(0,224,255,0.9) 4px,
        rgba(0,224,255,0.9) 8px,
        transparent 8px,
        transparent 12px,
        rgba(255,255,255,0.8) 12px,
        rgba(255,255,255,0.8) 16px
      );
      animation: screen-tear 0.6s ease-in-out infinite;
    }
    @keyframes screen-tear {
      0%, 100% { transform: translateX(0); opacity: 0.7; }
      25% { transform: translateX(-10px); opacity: 1; }
      50% { transform: translateX(8px); opacity: 0.8; }
      75% { transform: translateX(-5px); opacity: 1; }
    }
    .taskbar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 46px;
      background: #c0c0c0;
      border: 2px solid #0d0d26;
      box-shadow: 0 -2px 0 #030308;
      display: flex;
      align-items: center;
      padding: 3px 6px;
      gap: 8px;
      z-index: 200;
      box-sizing: border-box;
    }
    .start-btn {
      background: #c0c0c0;
      border: 2px solid;
      border-color: #0d0d26;
      font: bold 13px 'Share Tech Mono', monospace;
      padding: 3px 12px;
      color: #00e0ff;
      letter-spacing: 0.05em;
    }
    .taskbar-items { flex: 1; display: flex; gap: 4px; overflow: hidden; }
    .taskbar-item {
      background: #06060d;
      border: 2px inset #0d0d26;
      font: 12px 'Share Tech Mono', monospace;
      padding: 2px 10px;
      color: #a8f4ff;
      white-space: nowrap;
    }
    .taskbar-item.active { border-color: #030308 #16163a #16163a #030308; color: #00e0ff; }
    .taskbar-tray {
      display: flex;
      align-items: center;
      gap: 8px;
      border: 1px inset #0d0d26;
      background: #040409;
      padding: 2px 8px;
      font-size: 13px;
    }
    .tray-time { font: 13px 'Share Tech Mono', monospace; color: #00e0ff; }
  </style>
</head>
<body>
  <div class="card">
    <a href="index.html#portfolio" class="back-btn" onclick="playQrBackSound(this, event)">&#8592; [ BACK ]</a>
    <h1>SCAN TO OPEN THE SITE</h1>
    <div id="qrcode"></div>
    <div class="url">https://cbeast-dev.github.io/C.B_Photography/</div>
  </div>
  <footer class="taskbar">
    <div class="taskbar-start"><button class="start-btn">&#x229E; START</button></div>
    <div class="taskbar-items"><span class="taskbar-item active">&#128247; SHARE</span></div>
    <div class="taskbar-tray">
      <span>&#128266;</span>
      <span>&#128225;</span>
      <span class="tray-time" id="clock">00:00</span>
    </div>
  </footer>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script>
    var qrBackSound = new Audio('Sounds/ui-sound-16.mp3');
    qrBackSound.volume = 1;

    function playQrBackSound(link, event) {
      event.preventDefault();
      var target = link.href;
      qrBackSound.currentTime = 0;
      qrBackSound.play().catch(function() {});
      var overlay = document.createElement('div');
      overlay.className = 'glitch-overlay';
      overlay.innerHTML = '<div class="glitch-lines"></div>';
      document.body.appendChild(overlay);
      overlay.style.display = 'block';
      setTimeout(function() {
        window.location.href = target;
      }, 700);
    }

    function updateClock() {
      var now = new Date();
      document.getElementById('clock').textContent = String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');
    }
    updateClock();
    setInterval(updateClock, 1000);

    const qr = new QRCode(document.getElementById('qrcode'), {
      text: 'https://cbeast-dev.github.io/C.B_Photography/',
      width: 256,
      height: 256,
      colorDark : '#00e0ff',
      colorLight : '#020204',
      correctLevel : QRCode.CorrectLevel.H
    });
  </script>
</body>
</html>
